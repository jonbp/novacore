user nginx;

# For the folder listings (autoindex.xslt).
load_module modules/ngx_http_xslt_filter_module.so;

worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 256m;

    # Docker's embedded DNS. Vhosts pass to PHP through a variable, so nginx
    # resolves php8x at request time and starts fine even when a PHP version
    # isn't running.
    resolver 127.0.0.11 valid=10s ipv6=off;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    # Long enough to sit on an Xdebug breakpoint.
    fastcgi_read_timeout 3600s;

    ssl_protocols TLSv1.2 TLSv1.3;

    # For proxied websockets, such as Mailpit's live updates.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Fallback for unknown hosts: the Novacore dashboard at https://localhost.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/novacore/certs/localhost.crt;
        ssl_certificate_key /etc/novacore/certs/localhost.key;

        root /etc/novacore/www;
        index index.html;

        # Mailpit, which catches the mail PHP sends. Through a variable, like
        # PHP, so nginx starts even when Mailpit isn't running.
        location = /mail { return 301 /mail/; }
        location /mail/ {
            set $mailpit mailpit:8025;
            proxy_pass http://$mailpit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }

    include /etc/nginx/sites/*.conf;
}
