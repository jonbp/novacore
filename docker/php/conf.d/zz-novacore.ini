; Development defaults for every Novacore PHP version.

memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 256M
post_max_size = 256M

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

date.timezone = UTC

; Send mail() to Mailpit, which catches it: nothing leaves your machine.
sendmail_path = "/usr/local/bin/mailpit sendmail -t -S mailpit:1025"

; Pick up code changes immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
