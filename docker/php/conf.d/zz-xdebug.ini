; The mode comes from the XDEBUG_MODE environment variable (`novacore xdebug`).
;
; Debugging starts only when a request carries the trigger (XDEBUG_SESSION
; cookie/query param, which browser helper extensions set), so it costs
; nothing until you ask for it.
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = 0
xdebug.log_level = 0
xdebug.output_dir = /tmp
